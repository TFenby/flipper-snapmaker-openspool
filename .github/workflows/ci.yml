name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: stock
            index: https://update.flipperzero.one/firmware/directory.json
          - name: unleashed
            index: https://up.unleashedflip.com/directory.json
    steps:
      - uses: actions/checkout@v4
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        id: build
        with:
          sdk-channel: release
          sdk-index-url: ${{ matrix.index }}
      - run: cp "${{ steps.build.outputs.fap-dir }}/snapmaker_parser.fal" "snapmaker_parser-${{ matrix.name }}.fal"
      - uses: actions/upload-artifact@v4
        with:
          name: snapmaker_parser-${{ matrix.name }}
          path: snapmaker_parser-${{ matrix.name }}.fal
  # Tags vX.Y.Z publish both builds as Release assets; CI artifacts alone are too buried to be useful.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snapmaker_parser-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Built against the stock and Unleashed release SDKs current at build time. A .fal only loads when its API major matches your firmware; check device_info and see the README for building against another SDK." \
            snapmaker_parser-stock.fal snapmaker_parser-unleashed.fal
